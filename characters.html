<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Персонажи • Shadow Studios Wiki</title>
  <link rel="shortcut icon" href="images/logo.ico" type="image/x-icon" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="characters.css" />
</head>
<body class="page-characters">
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark"><img src="images/logo.ico" alt="Shadow Studios"></div>
      <div class="brand-copy">
        <div class="brand-title">Shadow Studios Wiki</div>
        <div class="brand-subtitle">персонажи</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-link" href="index.html">Главная</a>
      <a class="nav-link active" href="characters.html">Персонажи</a>
      <a class="nav-link" href="books.html">Книги</a>
    </nav>
  </header>

  <main class="content" id="main-content">
    <section class="page-hero">
      <div>
        <p class="eyebrow">вкладка персонажи</p>
        <h1>Герои, сущности и силы вселенной</h1>
      </div>
      <label class="search-wrap" for="characterSearch">
        <span>поиск по имени</span>
        <input id="characterSearch" type="search" placeholder="Начните вводить имя персонажа…" autocomplete="off" />
      </label>
    </section>

    <section>
      <div id="charactersGrid" class="characters-grid"></div>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" aria-label="Закрыть окно">×</button>
      <div class="modal-layout">
        <div class="modal-visuals">
          <img id="modalImage1" src="" alt="" />
          <img id="modalImage2" src="" alt="" />
        </div>
        <div class="modal-copy">
          <p class="eyebrow" id="modalAge"></p>
          <h2 id="modalTitle"></h2>
          <p id="modalShort" class="modal-short"></p>
          <div class="modal-full">
            <h3>Полное описание</h3>
            <p id="modalFull"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 Shadow Studios. Материалы сайта являются авторскими.</p>
  </footer>

  <script src="characters.js"></script>
</body>
</html>
